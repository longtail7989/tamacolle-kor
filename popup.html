<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>타마코레 한글화</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header><img src="icons/icon48.png" width="40" height="40" alt=""><h1>타마코레 한글화</h1></header>
  <label class="toggle"><span>한글화</span><input id="enabled" type="checkbox" role="switch" aria-label="한글화" disabled><span id="enabled-text">불러오는 중</span></label>
  <table class="versions" aria-label="확장 앱과 한글 리소스 버전">
    <thead><tr><th scope="col"></th><th scope="col">현재</th><th scope="col">서버 최신</th></tr></thead>
    <tbody>
      <tr><th scope="row">확장 앱</th><td id="extension-version">—</td><td id="extension-server">확인 전</td></tr>
      <tr><th scope="row">한글 리소스</th><td id="version">—</td><td id="resource-server">확인 전</td></tr>
    </tbody>
  </table>
  <button id="update" type="button" disabled>업데이트 확인</button>
  <div id="extension" class="extension" role="status" aria-live="polite" hidden>
    <p>확장 앱 <strong id="extension-latest"></strong> 업데이트를 확인하세요.</p>
    <a id="extension-link" href="#" target="_blank" rel="noopener noreferrer">확장 ZIP 내려받기</a>
    <p class="note">ZIP 설치판은 자동 설치되지 않습니다. 압축을 해제해 기존 확장 폴더의 파일을 교체한 뒤 <code>chrome://extensions</code>에서 해당 확장의 새로고침을 누르고 게임도 새로고침하세요.</p>
  </div>
  <p id="status" role="status" aria-live="polite">불러오는 중입니다.</p>
</body>
</html>
