name: Release Korean resources

on:
  push:
    tags:
      - 'resource-v*'
  workflow_dispatch:
    inputs:
      resource_tag:
        description: Existing resource-vx.y.z tag to publish
        required: true
        default: resource-v1.0.0

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.resource_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test resource updates and live runtime behavior
        run: node --test tests/resources.mjs tests/runtime.mjs tests/extension-update.mjs tests/crx.mjs
      - name: Build deterministic ZIP and signed Android CRX
        env:
          CRX_SIGNING_KEY: ${{ secrets.CRX_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CRX_SIGNING_KEY" ]; then
            echo "::error::CRX_SIGNING_KEY must contain the existing private signing key before publishing."
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/tamacolle-kor-crx-private.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$CRX_SIGNING_KEY" > "$key_file"
          node scripts/build.mjs --tag "$RELEASE_TAG" --crx-key "$key_file"
      - name: Publish PC ZIP, Android CRX, resources and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            dist/tamacolle-kor-*-extension.zip \
            dist/tamacolle-kor-*-extension.crx \
            dist/tamacolle-kor-resources.json \
            dist/SHA256SUMS \
            --verify-tag \
            --title "한국어 리소스 ${RELEASE_TAG#resource-v}" \
            --notes-file ".github/release-notes/$RELEASE_TAG.md"
